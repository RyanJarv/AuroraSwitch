name: Host safety tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: make check
      - run: make test-sanitize
  arm-builds:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Compile USB and synthetic transports with the pinned SDK/toolchain
        run: sh scripts/docker_build.sh make build build-virtual
