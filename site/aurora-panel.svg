<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 580" role="img" aria-labelledby="title description">
  <title id="title">Aurora front-panel control map</title>
  <desc id="description">The staggered knobs are 1 Warp, 2 Time, 3 Blur, 4 Reflect,
    5 Mix and 6 Atmosphere. Buttons are 7 Reverse, 8 Freeze and 9 Shift.
    Gate and CV inputs sit below the buttons; stereo audio inputs are bottom left,
    outputs bottom right. Simplified drawing, not to scale.</desc>
  <!-- Original schematic drawing; positions follow the Aurora manual's front panel. -->
  <defs>
    <g id="knob">
      <circle r="34" fill="#343e4b" stroke="#88929f" stroke-width="2"/>
      <circle r="27" fill="#e7e3d9"/>
      <path d="M0 -31V-18" stroke="#18212c" stroke-width="5"/>
      <circle r="13" fill="#263e52"/>
    </g>
    <g id="jack">
      <circle r="13" fill="#9aa3ac" stroke="#e1e5e9" stroke-width="2"/>
      <circle r="8" fill="#121923"/>
    </g>
    <g id="button">
      <circle r="14" fill="#e7e3d9" stroke="#88929f"/>
      <circle r="10" fill="#263e52"/>
    </g>
  </defs>
  <rect x="1" y="1" width="278" height="578" rx="12" fill="#18212c" stroke="#7b8795" stroke-width="2"/>
  <g fill="#4b5663"><circle cx="18" cy="18" r="4"/><circle cx="262" cy="18" r="4"/>
    <circle cx="18" cy="562" r="4"/><circle cx="262" cy="562" r="4"/></g>
  <g font-family="system-ui, sans-serif" text-anchor="middle" fill="#f1f3f5">
    <text x="140" y="40" font-size="23" letter-spacing="1">Aurora</text>
    <g font-size="14" font-weight="650">
      <use href="#knob" x="136" y="92"/><text x="136" y="97">1</text><text x="136" y="143">Warp</text>
      <use href="#knob" x="221" y="151"/><text x="221" y="156">2</text><text x="221" y="202">Time</text>
      <use href="#knob" x="136" y="214"/><text x="136" y="219">3</text><text x="136" y="265">Blur</text>
      <use href="#knob" x="221" y="271"/><text x="221" y="276">4</text><text x="221" y="322">Reflect</text>
      <use href="#knob" x="136" y="336"/><text x="136" y="341">5</text><text x="136" y="387">Mix</text>
      <use href="#knob" x="221" y="388"/><text x="221" y="393">6</text><text x="221" y="439" font-size="12">Atmosphere</text>
    </g>
    <rect x="17" y="106" width="67" height="27" rx="4" fill="#919ba5"/>
    <rect x="23" y="112" width="55" height="15" rx="2" fill="#121923"/>
    <text x="50" y="152" font-size="11" fill="#b4bfcc">USB</text>
    <g font-size="11" font-weight="650">
      <use href="#button" x="33" y="177"/><text x="33" y="181">7</text><text x="33" y="208">Reverse</text>
      <use href="#button" x="77" y="177"/><text x="77" y="181">8</text><text x="77" y="208">Freeze</text>
      <use href="#button" x="163" y="416"/><text x="163" y="420">9</text><text x="163" y="446">Shift</text>
    </g>
    <g font-size="11" fill="#b4bfcc">
      <use href="#jack" x="33" y="268"/><text x="33" y="294">Reverse</text>
      <use href="#jack" x="33" y="330"/><text x="33" y="356">Freeze</text>
      <use href="#jack" x="33" y="416"/><text x="33" y="444">Time</text>
      <use href="#jack" x="96" y="416"/><text x="96" y="444">Mix</text>
      <use href="#jack" x="96" y="475"/><text x="96" y="503">Warp</text>
      <use href="#jack" x="163" y="475"/><text x="163" y="503">Reflect</text>
      <use href="#jack" x="96" y="533"/><text x="96" y="559">Blur</text>
      <use href="#jack" x="163" y="533"/><text x="163" y="559">Atmos</text>
    </g>
    <g font-size="11">
      <text x="33" y="463" fill="#b4bfcc">IN</text>
      <use href="#jack" x="33" y="475"/><text x="33" y="503">Left</text>
      <use href="#jack" x="33" y="533"/><text x="33" y="559">Right</text>
      <rect x="197" y="455" width="49" height="113" rx="10" fill="#e7e3d9"/>
      <text x="221" y="468" fill="#18212c" font-size="9">OUT</text>
      <use href="#jack" x="221" y="485"/><text x="221" y="510" fill="#18212c">Left</text>
      <use href="#jack" x="221" y="535"/><text x="221" y="560" fill="#18212c">Right</text>
    </g>
  </g>
</svg>
